name: Enrich papers

# Adds preview images and organizations (with logos) to data/days/*.json.
# Runs on GitHub's machines; results are committed back to the repository.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max new papers to process (0 = all)"
        default: "0"
        required: true

permissions:
  contents: write
  pages: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r scripts/requirements.txt
      - name: Enrich
        env:
          LIMIT: ${{ inputs.limit }}
        run: python -I -u scripts/enrich.py --delay 1 --limit "$LIMIT"
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update preview images and organizations"
          git pull --rebase origin main
          git push
      - name: Rebuild GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
