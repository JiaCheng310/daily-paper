name: Daily update

# Every day: fetch new cs.RO papers from arXiv, add preview images and organizations,
# write tags + one-line summaries (Gemini), refresh upvotes, commit and redeploy.
#
# arXiv announces new papers Sunday-Thursday at 20:00 US Eastern, i.e. 08:00-09:00
# Beijing time Monday-Friday. 02:30 UTC = 10:30 Beijing, safely after the announcement
# in both summer and winter time. Weekend runs find nothing new and only refresh upvotes.
on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r scripts/requirements.txt
      - name: Fetch new papers
        run: python -I -u scripts/fetch_demo.py --cat cs.RO --days 3
      - name: Preview images and organizations
        continue-on-error: true
        run: python -I -u scripts/enrich.py --delay 1
      - name: Tags and one-line summaries
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -I -u scripts/summarize_gemini.py
      - name: Upvotes
        continue-on-error: true
        run: python -I -u scripts/popularity.py --window 30 --workers 4
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Daily update $(date -u +%F)"
          git pull --rebase origin main
          git push
      - name: Rebuild GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
