name: Update popularity

# Adds papers that became popular on Hugging Face / alphaXiv since the last run, refreshes
# upvotes (every paper of the last week, the top of older days), re-ranks, commits.
on:
  schedule:
    - cron: "23 1,9,17 * * *"  # 09:23, 17:23, 01:23 Beijing; 09:23 is just after arXiv's release
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  popularity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r scripts/requirements.txt
      - name: Newly popular papers (Hugging Face + alphaXiv)
        continue-on-error: true
        run: python -I -u scripts/fetch_hot.py
      - name: Fetch upvotes
        run: python -I -u scripts/popularity.py --window 30 --workers 4
      # Papers that just entered a day's top 30 get their summary now, not at the next
      # daily run (a few papers, a fraction of a cent even at DeepSeek's peak price).
      - name: Tags and one-line summaries
        continue-on-error: true
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -I -u scripts/summarize_gemini.py --workers 8
      - name: Organizations from the summaries
        continue-on-error: true
        run: python -I -u scripts/enrich.py --merge
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update popularity"
          git pull --rebase origin main
          git push
      - name: Rebuild GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
