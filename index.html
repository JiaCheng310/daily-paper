<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Paper</title>
<meta name="description" content="Daily embodied-AI papers from arXiv, ranked by relevance, with AI-generated FAQ.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<link rel="stylesheet" href="assets/style.css">
<script>
  (function () {
    try {
      var t = JSON.parse(localStorage.getItem('dp-theme') || 'null');
      if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    } catch (e) {}
  })();
</script>
</head>
<body>
<a class="skip" href="#papers" data-i18n="skip">跳到论文列表</a>

<header class="header">
  <a class="brand" href="./">Daily Paper</a>
  <nav id="cat-nav" aria-label="Categories"></nav>
  <div class="preferences">
    <button id="theme-btn" class="icon-button" type="button" data-i18n-title="theme">
      <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
    </button>
    <button id="lang-btn" class="language-button" type="button">EN</button>
  </div>
</header>

<main class="main">
  <div class="list-toolbar">
    <div class="edition">
      <h1 id="cat-title">&nbsp;</h1>
      <span id="total" class="muted"></span>
    </div>
    <div class="controls">
      <button id="prev-day" class="arrow" type="button" data-i18n-title="prevDay" aria-label="previous day">‹</button>
      <select id="date-select" aria-label="date"></select>
      <button id="next-day" class="arrow" type="button" data-i18n-title="nextDay" aria-label="next day">›</button>
      <select id="sort-select" aria-label="sort">
        <option value="score" data-i18n="sortScore">按相关度</option>
        <option value="original" data-i18n="sortOriginal">原始顺序</option>
        <option value="hf" data-i18n="sortHf">按 HF 点赞</option>
      </select>
      <select id="score-select" aria-label="minimum score">
        <option value="0" data-i18n="scoreAll">全部分数</option>
        <option value="3">≥ 3</option>
        <option value="5">≥ 5</option>
        <option value="7">≥ 7</option>
      </select>
    </div>
  </div>
  <div id="status" class="status" role="status"></div>
  <ol id="papers" class="papers"></ol>
</main>

<footer class="footer">
  <p data-i18n="disclaimer"></p>
  <p>Thank you to arXiv for use of its open access interoperability. · <a href="https://github.com/JiaCheng310/daily-paper">GitHub</a></p>
</footer>

<div id="app-bar" class="app-bar">
  <section id="panel-star" class="bar-panel" hidden>
    <div class="bar-panel-head"><strong data-i18n="starred">星标</strong><span id="star-count" class="muted"></span></div>
    <ol id="star-list" class="star-list"></ol>
    <div class="bar-actions">
      <button type="button" class="btn" id="export-md" data-i18n="exportMd">复制 Markdown</button>
      <button type="button" class="btn" id="export-dl" data-i18n="exportDl">下载 .md</button>
    </div>
  </section>
  <section id="panel-search" class="bar-panel" hidden>
    <div class="search-grid">
      <label>
        <span><span data-i18n="include">包含</span> (<button type="button" id="logic-btn" class="link">OR</button>)</span>
        <textarea id="kw-include" spellcheck="false" placeholder="VLA&#10;dexterous&#10;world model"></textarea>
      </label>
      <label>
        <span data-i18n="exclude">排除</span>
        <textarea id="kw-exclude" spellcheck="false" placeholder="UAV&#10;driving"></textarea>
      </label>
    </div>
    <div class="bar-actions">
      <button type="button" class="btn primary" id="search-apply" data-i18n="apply">搜索</button>
      <button type="button" class="btn" id="search-clear" data-i18n="clear">清空</button>
      <label class="check"><input type="checkbox" id="search-filter"> <span data-i18n="filter">只显示匹配</span></label>
      <label class="check"><input type="checkbox" id="search-highlight"> <span data-i18n="highlight">高亮</span></label>
    </div>
  </section>
  <section id="panel-settings" class="bar-panel" hidden>
    <div class="bar-actions column">
      <label class="check"><input type="checkbox" id="opt-abstract"> <span data-i18n="showAbstract">显示摘要</span></label>
      <label class="check"><input type="checkbox" id="opt-onlyfaq"> <span data-i18n="onlyFaq">只看有解读的</span></label>
      <label class="check"><input type="checkbox" id="opt-onlysummary"> <span data-i18n="onlySummary">只看有一句话总结的</span></label>
    </div>
  </section>
  <div class="bar-buttons" role="toolbar">
    <button type="button" class="bar-btn" data-panel="panel-star">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg>
      <span data-i18n="starred">星标</span><span id="star-badge" class="badge"></span>
    </button>
    <button type="button" class="bar-btn" data-panel="panel-search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg>
      <span data-i18n="search">搜索</span><span id="search-badge" class="badge"></span>
    </button>
    <button type="button" class="bar-btn" data-panel="panel-settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      <span data-i18n="settings">设置</span>
    </button>
    <button type="button" class="bar-btn" id="top-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
      <span data-i18n="top">顶部</span>
    </button>
  </div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" defer></script>
<script src="assets/app.js" defer></script>
</body>
</html>
